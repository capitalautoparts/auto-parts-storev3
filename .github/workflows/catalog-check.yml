name: Catalog checks
on:
  pull_request:
    branches: [staging, main]
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build
