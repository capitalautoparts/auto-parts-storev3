# /etc/nginx/sites-available/roysauto-staging on roysauto-staging (VM 459).
# Public traffic arrives from the Cloudflare Tunnel connectors (node0 .253,
# node1 .252) as plain HTTP with Host roys-staging.autrex.ca. TLS ends at the
# Cloudflare edge, exactly like staging.autrex.ca -> VM 453.
set_real_ip_from 192.168.88.252;
set_real_ip_from 192.168.88.253;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    server_name _;

    root /opt/roysauto/staging/current/dist;
    index index.html;

    # Staging only: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/catalog {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
    }

    # Vite emits content-hashed files under /assets.
    # Deployed release id (12-char sha), for the deploy smoke and humans.
    location = /__revision {
        default_type text/plain;
        expires -1;
        alias /opt/roysauto/staging/current/REVISION;
    }

    # No add_header in locations: it would drop the server-level headers.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
